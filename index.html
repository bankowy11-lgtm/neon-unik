<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0820">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Neon Unik</title>
<style>
  :root { --bg:#0b0820; --pink:#ff3d8b; --cyan:#3df2ff; --gold:#ffd23d; }
  html,body { margin:0; height:100%; background:var(--bg); overflow:hidden; touch-action:none;
    user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color:transparent;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color:#fff; }
  #c { display:block; width:100vw; height:100vh; height:100dvh; }
  .ov { position:fixed; inset:0; display:none; flex-direction:column; align-items:center; justify-content:center;
    gap:14px; text-align:center; padding:24px; background:rgba(11,8,32,.72); backdrop-filter:blur(3px); box-sizing:border-box; }
  .ov.show { display:flex; }
  .ov.top { justify-content:flex-start; padding-top:calc(20px + env(safe-area-inset-top)); background:rgba(11,8,32,.92); }
  h1 { font-size:clamp(48px,16vw,96px); line-height:.9; margin:0 0 8px; letter-spacing:4px; font-weight:900;
    color:var(--cyan); text-shadow:0 0 18px var(--cyan); }
  h1 span { color:var(--pink); text-shadow:0 0 18px var(--pink); }
  h2 { font-size:40px; margin:0; letter-spacing:3px; color:var(--pink); text-shadow:0 0 14px var(--pink); }
  h3 { text-align:left; margin:6px 0 10px; font-size:14px; letter-spacing:2px; opacity:.7; }
  .sub { max-width:300px; opacity:.85; line-height:1.4; margin:0; }
  .big { font-size:72px; font-weight:900; color:var(--gold); text-shadow:0 0 20px var(--gold); }
  #nr { color:var(--gold); font-weight:800; letter-spacing:2px; animation:pulse .6s infinite alternate; margin:0; }
  @keyframes pulse { to { transform:scale(1.12); } }
  button { font:inherit; font-weight:800; letter-spacing:2px; font-size:22px; color:var(--bg); background:var(--cyan);
    border:0; border-radius:40px; padding:16px 48px; box-shadow:0 0 24px var(--cyan); cursor:pointer; }
  button:active { transform:scale(.95); }
  button.ghost { background:transparent; color:#fff; box-shadow:none; font-size:16px; padding:8px 24px; opacity:.8; }
  button.sec { font-size:16px; padding:12px 22px; background:rgba(255,255,255,.1); color:#fff; box-shadow:none; position:relative; letter-spacing:1px; }
  .row { display:flex; gap:10px; }
  .coins { font-weight:800; color:var(--gold); font-size:20px; text-shadow:0 0 10px rgba(255,210,61,.6); margin:0; }
  .badge { position:absolute; top:-6px; right:-6px; background:var(--pink); color:#fff; border-radius:12px; font-size:12px; padding:2px 7px; letter-spacing:0; }
  .icon { position:fixed; top:calc(10px + env(safe-area-inset-top)); width:44px; height:44px; padding:0; font-size:18px;
    border-radius:50%; background:rgba(255,255,255,.1); color:#fff; box-shadow:none; display:none; letter-spacing:0; }
  .icon.show { display:block; }
  .icon.off { opacity:.45; }
  #pbtn { right:12px; } #mbtn { right:64px; } #musbtn { right:116px; }
  .best { opacity:.75; margin:0; }
  .panel { width:100%; max-width:440px; overflow-y:auto; touch-action:pan-y; flex:1; min-height:0; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); gap:10px; margin-bottom:18px; }
  .card { background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.12); border-radius:16px; padding:10px;
    display:flex; flex-direction:column; align-items:center; gap:6px; }
  .card.sel { border-color:var(--cyan); box-shadow:0 0 14px rgba(61,242,255,.4); }
  .card canvas { width:64px; height:64px; }
  .card .emo { font-size:38px; height:64px; line-height:64px; }
  .card .nm { font-size:14px; font-weight:700; }
  .card button { font-size:13px; padding:8px 10px; letter-spacing:1px; width:100%; box-shadow:none; }
  .card button.own { background:rgba(255,255,255,.15); color:#fff; }
  .card button.dis { opacity:.4; }
  .mis { background:rgba(255,255,255,.06); border:1px solid transparent; border-radius:14px; padding:12px 14px; text-align:left; margin-bottom:10px; }
  .mis.done { border-color:var(--gold); }
  .mis .t { font-weight:700; margin-bottom:8px; }
  .bar { height:6px; background:rgba(255,255,255,.12); border-radius:3px; overflow:hidden; }
  .bar i { display:block; height:100%; background:var(--cyan); }
  .mis.done .bar i { background:var(--gold); }
  .mis .r { display:flex; justify-content:space-between; font-size:13px; opacity:.8; margin-top:6px; }
  #runInfo { margin:0; font-weight:700; }
  #runMis { margin:0; color:var(--gold); font-size:14px; line-height:1.5; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="menu" class="ov show">
  <h1>NEON<br><span>UNIK</span></h1>
  <p class="sub">Przesuwaj palcem, żeby sterować.<br>Unikaj przeszkód, zbieraj ⭐ i bonusy.</p>
  <p class="coins">⭐ <span id="coinsM">0</span></p>
  <button id="play">GRAJ</button>
  <div class="row">
    <button class="sec" id="toShop">🛒 Sklep</button>
    <button class="sec" id="toMis">🎯 Misje<span class="badge" id="misBadge">0/3</span></button>
  </div>
  <p class="best">Rekord: <b id="bestM">0</b></p>
</div>

<div id="over" class="ov">
  <h2>KONIEC</h2>
  <div class="big" id="sc">0</div>
  <p id="nr">NOWY REKORD!</p>
  <p class="best">Rekord: <b id="bestO">0</b></p>
  <p id="runInfo"></p>
  <p id="runMis"></p>
  <button id="again">JESZCZE RAZ</button>
  <div class="row">
    <button class="sec" id="overShop">🛒 Sklep</button>
    <button class="sec" id="toMenu">Menu</button>
  </div>
</div>

<div id="pause" class="ov">
  <h2>PAUZA</h2>
  <button id="resume">GRAJ DALEJ</button>
  <button class="ghost" id="quit">Zakończ</button>
</div>

<div id="shop" class="ov top">
  <h2>SKLEP</h2>
  <p class="coins">⭐ <span id="coinsS">0</span></p>
  <div class="panel">
    <h3>STATKI</h3><div class="grid" id="shopShips"></div>
    <h3>SMUGI</h3><div class="grid" id="shopTrails"></div>
  </div>
  <button class="sec" id="shopBack">← Wróć</button>
</div>

<div id="missions" class="ov top">
  <h2>MISJE DNIA</h2>
  <p class="sub">Nowe misje codziennie o północy. Nagrody w ⭐ trafiają od razu do portfela.</p>
  <div class="panel" id="misList"></div>
  <button class="sec" id="misBack">← Wróć</button>
</div>

<button id="pbtn" class="icon" aria-label="Pauza">❚❚</button>
<button id="mbtn" class="icon show" aria-label="Dźwięk">🔊</button>
<button id="musbtn" class="icon show" aria-label="Muzyka">🎵</button>

<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const $ = id => document.getElementById(id);
let W, H;
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (player) player.y = H - Math.max(110, H * .16);
}
addEventListener('resize', resize);

// --- zapis (localStorage może nie działać w trybie prywatnym) ---
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
let best = store.get('nu_best', 0), muted = store.get('nu_muted', false), musicOn = store.get('nu_music', true);

// --- sklep: statki i smugi kupowane za gwiazdki ---
const SHIPS = [
  { id: 'arrow',   name: 'Strzała',         price: 0,   color: '#3df2ff', shape: 'arrow' },
  { id: 'rose',    name: 'Różowa strzała',  price: 60,  color: '#ff5ec8', shape: 'arrow' },
  { id: 'fighter', name: 'Myśliwiec',       price: 150, color: '#7dff6b', shape: 'fighter' },
  { id: 'ufo',     name: 'Spodek',          price: 250, color: '#b06bff', shape: 'ufo' },
  { id: 'gold',    name: 'Złoty myśliwiec', price: 400, color: '#ffd23d', shape: 'fighter' },
  { id: 'rainbow', name: 'Tęczowy spodek',  price: 700, color: 'rainbow', shape: 'ufo' },
];
const TRAILS = [
  { id: 'classic', name: 'Klasyczna', price: 0,   emo: '💠' },
  { id: 'sparks',  name: 'Iskry',     price: 80,  emo: '✨' },
  { id: 'fire',    name: 'Ogień',     price: 150, emo: '🔥' },
  { id: 'rainbow', name: 'Tęcza',     price: 300, emo: '🌈' },
];
const prof = Object.assign({ coins: 0, owned: ['arrow', 'classic'], ship: 'arrow', trail: 'classic' }, store.get('nu_profile', {}));
const saveProf = () => store.set('nu_profile', prof);
const myShip = () => SHIPS.find(s => s.id === prof.ship) || SHIPS[0];
const colorOf = s => s.color === 'rainbow' ? `hsl(${(performance.now() / 8) % 360},100%,62%)` : s.color;

// --- strefy: co 500 pkt nowa paleta i nowy rodzaj przeszkód ---
const ZONES = [
  { name: 'NEON CITY',     bg: ['#0b0820', '#241046'], obs: '#ff3d8b', spin: '#ff8a3d' },
  { name: 'GŁĘBIA',        bg: ['#020f1a', '#063a4a'], obs: '#b06bff', spin: '#ff6b6b', news: 'Nowość: zygzaki' },
  { name: 'ZACHÓD SŁOŃCA', bg: ['#14040c', '#5a1430'], obs: '#ff4d6d', spin: '#ff9f1c', news: 'Nowość: rosnące bloki' },
  { name: 'MATRIX',        bg: ['#010a04', '#073318'], obs: '#ff3d8b', spin: '#e2ff3d', news: 'Nowość: lasery!' },
  { name: 'PUSTKA',        bg: ['#000000', '#181828'], obs: '#f2f2ff', spin: '#ff3d8b' },
];
let zone = 1;
const pal = () => ZONES[(zone - 1) % ZONES.length];

// --- misje dnia: 3 losowane według daty ---
const MISSIONS = [
  { id: 'stars25',   text: 'Zbierz 25 gwiazdek w jednym biegu',      stat: 'stars',      goal: 25,   reward: 30 },
  { id: 'stars50',   text: 'Zbierz 50 gwiazdek w jednym biegu',      stat: 'stars',      goal: 50,   reward: 60 },
  { id: 'clean60',   text: 'Przetrwaj 60 s bez zbierania tarczy',    stat: 'clean',      goal: 60,   reward: 50 },
  { id: 'time90',    text: 'Przetrwaj 90 sekund',                    stat: 'time',       goal: 90,   reward: 60 },
  { id: 'zone3',     text: 'Dotrzyj do strefy 3',                    stat: 'zone',       goal: 3,    reward: 40 },
  { id: 'zone5',     text: 'Dotrzyj do strefy 5',                    stat: 'zone',       goal: 5,    reward: 80 },
  { id: 'combo8',    text: 'Zrób combo x8',                          stat: 'combo',      goal: 8,    reward: 40 },
  { id: 'near10',    text: '10 razy „blisko!” w jednym biegu',       stat: 'near',       goal: 10,   reward: 40 },
  { id: 'score1000', text: 'Zdobądź 1000 punktów',                   stat: 'score',      goal: 1000, reward: 40 },
  { id: 'shield2',   text: 'Rozbij 2 przeszkody tarczą w jednym biegu', stat: 'shieldHits', goal: 2, reward: 40 },
  { id: 'day100',    text: 'Zbierz dziś łącznie 100 gwiazdek',       stat: 'dayStars',   goal: 100,  reward: 50, day: true },
  { id: 'games5',    text: 'Zagraj dziś 5 gier',                     stat: 'games',      goal: 5,    reward: 30, day: true },
];
const MBY = Object.fromEntries(MISSIONS.map(m => [m.id, m]));
const today = () => { const d = new Date(); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); };
function loadDaily() {
  let d = store.get('nu_daily', null);
  if (!d || d.date !== today() || !d.ids.every(id => MBY[id])) {
    let h = 7; for (const ch of today()) h = (Math.imul(h, 31) + ch.charCodeAt(0)) >>> 0;
    const pool = MISSIONS.map(m => m.id), ids = [];
    while (ids.length < 3) { h = (Math.imul(h, 1103515245) + 12345) >>> 0; ids.push(pool.splice(h % pool.length, 1)[0]); }
    d = { date: today(), ids, prog: {}, done: [], dayStars: 0, games: 0 };
    store.set('nu_daily', d);
  }
  return d;
}
let daily = loadDaily();

// --- dźwięk i muzyka generowane w locie (Web Audio, bez plików audio) ---
// tor: efekty -> sfxBus -> master;  muzyka -> musicBus -> musicFilter -> master
let actx = null, master, sfxBus, musicBus, musicFilter, noiseBuf, cutoff = 18000;
function audio() {
  if (actx) { if (actx.state === 'suspended' && !document.hidden) actx.resume(); return actx; }
  try {
    actx = new (window.AudioContext || window.webkitAudioContext)();
    master = actx.createGain(); master.gain.value = muted ? 0 : 1; master.connect(actx.destination);
    sfxBus = actx.createGain(); sfxBus.gain.value = .9; sfxBus.connect(master);
    musicFilter = actx.createBiquadFilter(); musicFilter.type = 'lowpass'; musicFilter.frequency.value = cutoff;
    musicFilter.connect(master);
    musicBus = actx.createGain(); musicBus.gain.value = musicOn ? .55 : 0; musicBus.connect(musicFilter);
    noiseBuf = actx.createBuffer(1, actx.sampleRate * .5, actx.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    setInterval(musicTick, 25);
  } catch (e) { actx = null; }
  return actx;
}
const mtof = m => 440 * 2 ** ((m - 69) / 12);
function tone(freq, dur, type = 'sine', vol = .12, slide = 0, when = 0, bus) {
  if (!audio()) return;
  bus = bus || sfxBus;
  const t = actx.currentTime + when, o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), t + dur);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .006); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g).connect(bus); o.start(t); o.stop(t + dur + .02);
}
function noise(dur, vol = .2, freq = 1000, when = 0, bus, type = 'bandpass') {
  if (!audio()) return;
  bus = bus || sfxBus;
  const t = actx.currentTime + when, s = actx.createBufferSource(), f = actx.createBiquadFilter(), g = actx.createGain();
  s.buffer = noiseBuf; f.type = type; f.frequency.value = freq;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  s.connect(f).connect(g).connect(bus); s.start(t); s.stop(t + dur);
}

// efekty dźwiękowe
const SCALE = [0, 2, 4, 7, 9, 12, 14, 16];
const S = {
  click() { tone(880, .06, 'square', .05); },
  start() { [60, 64, 67, 72].forEach((n, i) => tone(mtof(n + 12), .18, 'square', .06, 0, i * .07)); },
  star(c) { const n = 72 + SCALE[c - 1]; tone(mtof(n), .16, 'triangle', .14); tone(mtof(n + 12), .12, 'sine', .06, 0, .04);
    if (c === 4 || c === 8) [0, 4, 7, 12].forEach((k, i) => tone(mtof(n + k), .14, 'square', .045, 0, .1 + i * .05)); },
  near() { noise(.18, .1, 2500); tone(1400, .05, 'sine', .04); },
  power() { [67, 71, 74, 79, 83].forEach((n, i) => tone(mtof(n), .22, 'sine', .1, 0, i * .05)); },
  shieldBreak() { noise(.35, .35, 700, 0, null, 'lowpass'); tone(260, .35, 'square', .09, -180); },
  death() { noise(.9, .45, 500, 0, null, 'lowpass'); tone(330, 1, 'sawtooth', .14, -280); tone(110, .6, 'sine', .3, -70); },
  over(rec) {
    if (rec) [60, 64, 67, 72, 76, 79, 84].forEach((n, i) => tone(mtof(n + 12), .3, 'square', .06, 0, i * .08));
    else [67, 63, 60, 55].forEach((n, i) => tone(mtof(n), .35, 'triangle', .12, 0, i * .16));
  },
  pause() { tone(440, .1, 'triangle', .08); tone(330, .14, 'triangle', .08, 0, .08); },
  zone() { tone(180, .7, 'sawtooth', .07, 900); [60, 64, 67, 72].forEach((n, i) => tone(mtof(n + 12), .5, 'sine', .08, 0, .3 + i * .04)); },
  mission() { [72, 76, 79, 84, 88].forEach((n, i) => tone(mtof(n), .2, 'square', .06, 0, i * .07)); tone(2400, .4, 'sine', .04, 0, .35); },
  laserWarn() { [0, .18, .36].forEach(w => tone(1500, .07, 'square', .04, 0, w)); },
  laserFire() { noise(.4, .25, 3000); tone(900, .45, 'sawtooth', .08, -700); },
  buy() { [72, 79, 84, 91].forEach((n, i) => tone(mtof(n), .18, 'triangle', .1, 0, i * .06)); },
  deny() { tone(160, .2, 'square', .06); },
};

// muzyka: synthwave Am–F–C–G, 16 kroków na akord; w grze dochodzą perkusja i przyspieszenie
const PROG = [[57, 60, 64], [53, 57, 60], [48, 52, 55], [55, 59, 62]];
let mStep = 0, mNext = 0;
function musicTick() {
  if (!actx || !musicOn || actx.state !== 'running') { if (actx) mNext = actx.currentTime + .05; return; }
  const bpm = state === 'play' ? 112 + diff() * 28 : 92, step = 60 / bpm / 4;
  if (mNext < actx.currentTime) mNext = actx.currentTime + .05;
  while (mNext < actx.currentTime + .12) {
    playStep(mStep, mNext - actx.currentTime, step);
    mNext += step; mStep = (mStep + 1) % 64;
  }
}
function playStep(s, w, step) {
  const chord = PROG[s >> 4], b = s & 15, play = state === 'play', lvl = play ? diff() : -1, M = musicBus;
  if (b === 0) chord.forEach(n => tone(mtof(n), step * 16, 'sine', .03, 0, w, M));            // podkład
  if (s % 2 === 0) tone(mtof(chord[0] - 24 + (b === 14 ? 12 : 0)), step * 1.8, 'triangle', .22, 0, w, M); // bas
  if (play || s % 2 === 0) {                                                                   // arpeggio
    const n = chord[[0, 1, 2, 1][s & 3]] + 12 + (lvl > .5 && (s & 8) ? 12 : 0);
    tone(mtof(n), step * .9, 'square', play ? .03 : .018, 0, w, M);
  }
  if (!play) return;
  if (b % 4 === 0) tone(150, .28, 'sine', .45, -110, w, M);                                    // stopa
  if (s % 4 === 2 || (lvl > .3 && s % 2 === 1)) noise(.04, .07, 8000, w, M, 'highpass');       // hi-hat
  if (lvl > .55 && (b === 4 || b === 12)) noise(.16, .18, 1800, w, M);                         // werbel
}
function setCutoff(f, speed = .15) { if (actx && f !== cutoff) { cutoff = f; musicFilter.frequency.setTargetAtTime(f, actx.currentTime, speed); } }
const buzz = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };

// --- stan gry ---
let state = 'menu', player = null, obs = [], stars = [], powers = [], parts = [], texts = [], banners = [], run = null;
let score = 0, time = 0, combo = 1, comboT = 0, shake = 0, spawnT, starT, powT, laserT, shield = 0, slow = 0, deadT = 0;
let flash = 0, flashCol = '255,61,139';
const bg = Array.from({ length: 90 }, () => ({ x: Math.random(), y: Math.random(), z: Math.random() * .8 + .2 }));
resize();

function reset() {
  player = { x: W / 2, y: H - Math.max(110, H * .16), tx: W / 2, r: 11, tilt: 0, trail: [] };
  obs = []; stars = []; powers = []; parts = []; texts = []; banners = [];
  score = 0; time = 0; combo = 1; comboT = 0; shake = 0; spawnT = .6; starT = 1.2; powT = 9; laserT = 3;
  shield = 0; slow = 0; deadT = 0; flash = 0; zone = 1;
  run = { stars: 0, near: 0, shieldHits: 0, combo: 1, clean: 0, time: 0, zone: 1, score: 0, picked: false, missions: [] };
}
const diff = () => Math.min(1, time / 75);   // trudność rośnie przez ~75 s

function spawnObstacle() {
  const d = diff(), r = Math.random();
  let kind = 'block';
  if (r < .18 + d * .2) kind = 'spin';
  else if (zone >= 2 && r < .42) kind = 'zig';
  else if (zone >= 3 && r < .58) kind = 'grow';
  const o = { kind, y: -40, vy: (170 + d * 280) * (.8 + Math.random() * .45), vx: 0, rot: 0, vr: (Math.random() - .5) * 7, t: 0, near: false };
  if (kind === 'spin') {
    o.w = o.h = 26 + Math.random() * 16; o.x = o.w / 2 + Math.random() * (W - o.w); o.vx = (Math.random() - .5) * 160 * (.3 + d);
  } else if (kind === 'zig') {
    o.w = 36 + Math.random() * 24; o.h = 18; o.amp = 50 + Math.random() * 40; o.f = 2.5 + Math.random() * 1.5;
    o.bx = o.amp + o.w / 2 + Math.random() * Math.max(0, W - 2 * o.amp - o.w); o.x = o.bx; o.vy *= .85;
  } else if (kind === 'grow') {
    o.w = 24; o.h = 18; o.maxW = Math.min(W * .45, 110 + Math.random() * 70); o.x = o.maxW / 2 + Math.random() * (W - o.maxW); o.vy *= .8;
  } else {
    o.w = 34 + Math.random() * (50 + d * 70); o.h = 16 + Math.random() * 12; o.x = o.w / 2 + Math.random() * (W - o.w);
  }
  obs.push(o);
}
function spawnLaser() {
  const x = Math.max(20, Math.min(W - 20, player.x + (Math.random() - .5) * 140));
  obs.push({ kind: 'laser', x, y: H / 2, w: 22, h: H, t: 0, warn: 1.1, fire: .45, fired: false, near: true });
  S.laserWarn();
}
function spawnStar() { stars.push({ x: 24 + Math.random() * (W - 48), y: -20, vy: 150 + diff() * 120, t: 0 }); }
function spawnPower() { powers.push({ x: 30 + Math.random() * (W - 60), y: -20, vy: 140, kind: Math.random() < .5 ? 'shield' : 'slow', t: 0 }); }

function burst(x, y, color, n = 16, sp = 220) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, v = sp * (.3 + Math.random());
    parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: .5 + Math.random() * .5, color, s: 2 + Math.random() * 3 });
  }
}
function popText(x, y, txt, color) { texts.push({ x, y, txt, color, life: 1 }); }
function banner(title, sub, color, sub2) { banners.push({ title, sub, color, sub2, t: 2.2 }); }

function checkMissions() {
  for (const id of daily.ids) {
    if (daily.done.includes(id)) continue;
    const m = MBY[id], v = (m.day ? daily[m.stat] : run[m.stat]) || 0;
    if (!m.day) daily.prog[id] = Math.max(daily.prog[id] || 0, v);
    if (v >= m.goal) {
      daily.done.push(id); prof.coins += m.reward; run.missions.push(m);
      banner('MISJA WYKONANA!', m.text, '#ffd23d', '+' + m.reward + ' ⭐');
      S.mission(); buzz([20, 30, 20]); store.set('nu_daily', daily); saveProf();
    }
  }
}
const missionValue = m => Math.min(m.goal, Math.floor(m.day ? (daily[m.stat] || 0) : (daily.prog[m.id] || 0)));

// --- logika ---
function circleRect(cx, cy, r, o) {
  const nx = Math.max(o.x - o.w / 2, Math.min(cx, o.x + o.w / 2));
  const ny = Math.max(o.y - o.h / 2, Math.min(cy, o.y + o.h / 2));
  return (cx - nx) ** 2 + (cy - ny) ** 2 < r * r;
}

function update(dt) {
  time += dt;
  const ts = slow > 0 ? .45 : 1, d = diff(), p = player;

  // gracz
  if (keys.ArrowLeft || keys.a) p.tx -= 520 * dt;
  if (keys.ArrowRight || keys.d) p.tx += 520 * dt;
  p.tx = Math.max(18, Math.min(W - 18, p.tx));
  const prevX = p.x;
  p.x += (p.tx - p.x) * Math.min(1, dt * 18);
  p.tilt = Math.max(-.5, Math.min(.5, (p.x - prevX) / (dt * 900)));
  p.trail.unshift({ x: p.x, y: p.y }); if (p.trail.length > 14) p.trail.pop();
  if (prof.trail === 'sparks' && Math.random() < .8)
    parts.push({ x: p.x + (Math.random() - .5) * 10, y: p.y + 12, vx: (Math.random() - .5) * 70, vy: 90 + Math.random() * 90,
      life: .45, color: colorOf(myShip()), s: 2 + Math.random() * 2 });

  // strefy
  const z = 1 + Math.floor(score / 500);
  if (z > zone) {
    zone = z; run.zone = z; const zp = pal();
    banner('STREFA ' + z, zp.name, zp.obs, zp.news && z <= ZONES.length ? zp.news : '');
    S.zone(); flash = .5; flashCol = '255,255,255'; buzz([20, 40, 20]);
  }

  // pojawianie się obiektów
  spawnT -= dt * ts; starT -= dt * ts; powT -= dt * ts;
  if (spawnT <= 0) { spawnObstacle(); if (d > .5 && Math.random() < d * .4) spawnObstacle(); spawnT = .85 - d * .55; }
  if (starT <= 0) { spawnStar(); starT = .9 + Math.random() * 1.1; }
  if (powT <= 0) { spawnPower(); powT = 10 + Math.random() * 8; }
  if (zone >= 4 && (laserT -= dt * ts) <= 0) { spawnLaser(); laserT = Math.max(2.5, 5.5 - (zone - 4) * .6) + Math.random() * 2; }

  score += dt * 10 * (1 + d);
  if (comboT > 0 && (comboT -= dt) <= 0) combo = 1;
  if (shield > 0) shield -= dt;
  if (slow > 0) slow -= dt;

  // przeszkody
  for (let i = obs.length - 1; i >= 0; i--) {
    const o = obs[i];
    if (o.kind === 'laser') {
      o.t += dt * ts;
      if (!o.fired && o.t >= o.warn) { o.fired = true; S.laserFire(); shake = Math.max(shake, 6); buzz(30); }
      const firing = o.fired && o.t < o.warn + o.fire;
      if (firing && !o.harmless && Math.abs(p.x - o.x) < o.w / 2 + p.r * .7) {
        if (shield > 0) {
          shield = 0; o.harmless = true; run.shieldHits++; burst(p.x, p.y, '#3df2ff', 24); S.shieldBreak(); buzz(40);
          popText(p.x, p.y - 30, 'TARCZA!', '#3df2ff');
        } else { gameOver(); return; }
      }
      if (o.t > o.warn + o.fire) obs.splice(i, 1);
      continue;
    }
    o.t += dt * ts; o.y += o.vy * dt * ts; o.rot += o.vr * dt * ts;
    if (o.kind === 'spin') { o.x += o.vx * dt * ts; if (o.x < o.w / 2 || o.x > W - o.w / 2) o.vx *= -1; }
    if (o.kind === 'zig') o.x = o.bx + Math.sin(o.t * o.f) * o.amp;
    if (o.kind === 'grow') o.w = Math.min(o.maxW, o.w + 90 * dt * ts);
    const hit = o.kind === 'spin' ? Math.hypot(o.x - p.x, o.y - p.y) < o.w * .45 + p.r : circleRect(p.x, p.y, p.r, o);
    if (hit) {
      if (shield > 0) {
        shield = 0; run.shieldHits++; burst(o.x, o.y, pal().obs, 24); shake = 8; S.shieldBreak(); buzz(40);
        popText(o.x, o.y, 'TARCZA!', '#3df2ff'); obs.splice(i, 1); continue;
      }
      gameOver(); return;
    }
    if (!o.near && o.y > p.y && Math.abs(o.x - p.x) < (o.kind === 'spin' ? o.w * .45 : o.w / 2) + p.r + 18) {
      o.near = true; score += 5; run.near++; popText(p.x, p.y - 30, 'blisko! +5', '#fff'); S.near();
    }
    if (o.y > H + 60) obs.splice(i, 1);
  }

  // gwiazdki (lekko przyciągane)
  for (let i = stars.length - 1; i >= 0; i--) {
    const s = stars[i]; s.t += dt; s.y += s.vy * dt * ts;
    const dx = p.x - s.x, dy = p.y - s.y, dist = Math.hypot(dx, dy);
    if (dist < 90) { s.x += dx / dist * 160 * dt; s.y += dy / dist * 160 * dt; }
    if (dist < p.r + 16) {
      const pts = 10 * combo; score += pts;
      popText(s.x, s.y, '+' + pts, '#ffd23d'); burst(s.x, s.y, '#ffd23d', 12, 160);
      S.star(combo); buzz(12);
      prof.coins++; run.stars++; daily.dayStars++;
      combo = Math.min(8, combo + 1); comboT = 2.5; run.combo = Math.max(run.combo, combo);
      stars.splice(i, 1); continue;
    }
    if (s.y > H + 30) stars.splice(i, 1);
  }

  // bonusy
  for (let i = powers.length - 1; i >= 0; i--) {
    const q = powers[i]; q.t += dt; q.y += q.vy * dt * ts;
    if (Math.hypot(p.x - q.x, p.y - q.y) < p.r + 18) {
      if (q.kind === 'shield') { shield = 7; run.picked = true; popText(q.x, q.y, 'TARCZA', '#3df2ff'); }
      else { slow = 4; popText(q.x, q.y, 'SPOWOLNIENIE', '#7dff6b'); }
      burst(q.x, q.y, q.kind === 'shield' ? '#3df2ff' : '#7dff6b', 20); S.power(); buzz(20);
      powers.splice(i, 1); continue;
    }
    if (q.y > H + 30) powers.splice(i, 1);
  }

  run.time = time; run.score = score; if (!run.picked) run.clean = time;
  checkMissions();
}

function updateFx(dt) {
  for (let i = parts.length - 1; i >= 0; i--) {
    const q = parts[i]; q.x += q.vx * dt; q.y += q.vy * dt; q.vx *= .96; q.vy *= .96; q.life -= dt;
    if (q.life <= 0) parts.splice(i, 1);
  }
  for (let i = texts.length - 1; i >= 0; i--) { texts[i].y -= 50 * dt; if ((texts[i].life -= dt) <= 0) texts.splice(i, 1); }
  if (banners.length && (banners[0].t -= dt) <= 0) banners.shift();
  shake = Math.max(0, shake - dt * 40); flash = Math.max(0, flash - dt * 3);
  const speed = state === 'play' ? (slow > 0 ? .4 : 1) * (1 + diff() * 2) : .4;
  for (const s of bg) { s.y += s.z * speed * dt * .25; if (s.y > 1) { s.y = 0; s.x = Math.random(); } }
}

// --- rysowanie ---
function draw() {
  const zp = pal();
  ctx.save();
  if (shake > 0) ctx.translate((Math.random() - .5) * shake, (Math.random() - .5) * shake);
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, zp.bg[0]); g.addColorStop(1, zp.bg[1]);
  ctx.fillStyle = g; ctx.fillRect(-20, -20, W + 40, H + 40);
  if (slow > 0 && state === 'play') { ctx.fillStyle = 'rgba(60,255,140,.08)'; ctx.fillRect(-20, -20, W + 40, H + 40); }

  for (const s of bg) { ctx.globalAlpha = s.z * .8; ctx.fillStyle = '#fff'; ctx.fillRect(s.x * W, s.y * H, s.z * 2.2, s.z * 2.2 + (state === 'play' ? s.z * 6 : 0)); }
  ctx.globalAlpha = 1;

  if (player) {
    for (const s of stars) drawStar(s.x, s.y, 11 + Math.sin(s.t * 8) * 1.5, s.t * 2);
    for (const q of powers) drawPower(q);
    for (const o of obs) drawObstacle(o, zp);
    if (state === 'play' || state === 'pause') drawPlayer();
  }

  ctx.globalCompositeOperation = 'lighter';
  for (const q of parts) { ctx.globalAlpha = Math.max(0, q.life); ctx.fillStyle = q.color; ctx.fillRect(q.x - q.s / 2, q.y - q.s / 2, q.s, q.s); }
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;

  ctx.textAlign = 'center'; ctx.font = '800 16px system-ui, sans-serif';
  for (const t of texts) { ctx.globalAlpha = Math.max(0, t.life); ctx.fillStyle = t.color; ctx.fillText(t.txt, t.x, t.y); }
  ctx.globalAlpha = 1;
  ctx.restore();

  if (flash > 0) { ctx.fillStyle = `rgba(${flashCol},${flash * .35})`; ctx.fillRect(0, 0, W, H); }
  if (player && (state === 'play' || state === 'pause' || state === 'dying')) { drawHud(); drawBanner(); }
}

function glow(color, blur) { ctx.shadowColor = color; ctx.shadowBlur = blur; }

function drawShip(c, x, y, shape, col, tilt = 0, sc = 1) {
  c.save(); c.translate(x, y); c.rotate(tilt); c.scale(sc, sc);
  c.shadowColor = col; c.shadowBlur = 20; c.fillStyle = col; c.beginPath();
  if (shape === 'fighter') {
    [[0, -22], [5, -6], [18, 6], [18, 12], [5, 8], [4, 14], [-4, 14], [-5, 8], [-18, 12], [-18, 6], [-5, -6]].forEach(([a, b]) => c.lineTo(a, b));
    c.closePath();
  } else if (shape === 'ufo') {
    c.ellipse(0, 4, 19, 7, 0, 0, Math.PI * 2);
  } else {
    c.moveTo(0, -20); c.lineTo(15, 14); c.lineTo(0, 7); c.lineTo(-15, 14); c.closePath();
  }
  c.fill(); c.shadowBlur = 0;
  if (shape === 'ufo') {
    c.fillStyle = 'rgba(255,255,255,.75)'; c.beginPath(); c.arc(0, 1, 8, Math.PI, 0); c.fill();
    c.fillStyle = '#fff'; for (let i = -1; i <= 1; i++) { c.beginPath(); c.arc(i * 10, 5, 1.8, 0, 7); c.fill(); }
  } else {
    c.fillStyle = '#fff'; c.beginPath(); c.arc(0, shape === 'fighter' ? -6 : -2, 3.5, 0, 7); c.fill();
  }
  c.restore();
}

function drawPlayer() {
  const p = player, ship = myShip(), col = colorOf(ship), tr = prof.trail;
  if (tr !== 'sparks') {
    ctx.globalCompositeOperation = 'lighter';
    p.trail.forEach((t, i) => {
      const k = 1 - i / p.trail.length;
      let c = col, rad = 6 * k;
      if (tr === 'rainbow') c = `hsl(${(i * 25 + time * 200) % 360},100%,60%)`;
      if (tr === 'fire') { c = `hsl(${50 - i * 4},100%,${60 - i}%)`; rad = 8 * k; }
      ctx.globalAlpha = k * .4; ctx.fillStyle = c;
      ctx.beginPath(); ctx.arc(t.x + (tr === 'fire' ? (Math.random() - .5) * 4 : 0), t.y + 10 + i * 3, rad, 0, 7); ctx.fill();
    });
    ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
  }
  drawShip(ctx, p.x, p.y, ship.shape, col, p.tilt);
  if (shield > 0) {
    const blink = shield < 1.5 && Math.floor(shield * 8) % 2;
    if (!blink) { glow('#3df2ff', 16); ctx.strokeStyle = 'rgba(61,242,255,.8)'; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.arc(p.x, p.y, 28 + Math.sin(time * 10) * 2, 0, 7); ctx.stroke(); ctx.shadowBlur = 0; }
  }
}

function drawObstacle(o, zp) {
  if (o.kind === 'laser') {
    if (o.t < o.warn) {
      ctx.globalAlpha = .25 + .55 * Math.abs(Math.sin(o.t * 14)); ctx.strokeStyle = zp.obs; ctx.lineWidth = 2;
      ctx.setLineDash([10, 8]); ctx.beginPath(); ctx.moveTo(o.x, 0); ctx.lineTo(o.x, H); ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle = zp.obs; ctx.font = '900 26px system-ui, sans-serif'; ctx.textAlign = 'center';
      ctx.fillText('!', o.x, 120); ctx.globalAlpha = 1;
    } else if (!o.harmless || o.t < o.warn + o.fire) {
      const k = 1 - (o.t - o.warn) / o.fire, w = o.w * (.4 + .6 * k);
      glow(zp.obs, 30); ctx.fillStyle = zp.obs; ctx.globalAlpha = o.harmless ? .3 : 1;
      ctx.fillRect(o.x - w / 2, 0, w, H); ctx.shadowBlur = 0;
      ctx.fillStyle = '#fff'; ctx.fillRect(o.x - w / 6, 0, w / 3, H); ctx.globalAlpha = 1;
    }
    return;
  }
  ctx.save(); ctx.translate(o.x, o.y);
  if (o.kind === 'spin') {
    ctx.rotate(o.rot); glow(zp.spin, 18); ctx.fillStyle = zp.spin;
    const r = o.w / 2; ctx.beginPath();
    for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4, rr = i % 2 ? r * .55 : r; ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); }
    ctx.closePath(); ctx.fill();
  } else {
    glow(zp.obs, 18); ctx.fillStyle = zp.obs;
    roundRect(-o.w / 2, -o.h / 2, o.w, o.h, 6); ctx.fill();
    ctx.shadowBlur = 0; ctx.fillStyle = 'rgba(255,255,255,.35)'; roundRect(-o.w / 2 + 4, -o.h / 2 + 3, o.w - 8, 3, 2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.85)';
    if (o.kind === 'zig') {          // strzałki w obie strony = porusza się na boki
      const e = o.w / 2 + 5;
      ctx.beginPath(); ctx.moveTo(e + 7, 0); ctx.lineTo(e, -5); ctx.lineTo(e, 5); ctx.fill();
      ctx.beginPath(); ctx.moveTo(-e - 7, 0); ctx.lineTo(-e, -5); ctx.lineTo(-e, 5); ctx.fill();
    } else if (o.kind === 'grow') {  // jasne końce = rośnie
      ctx.fillRect(-o.w / 2, -o.h / 2, 4, o.h); ctx.fillRect(o.w / 2 - 4, -o.h / 2, 4, o.h);
    }
  }
  ctx.restore(); ctx.shadowBlur = 0;
}

function drawStar(x, y, r, rot) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); glow('#ffd23d', 16); ctx.fillStyle = '#ffd23d'; ctx.beginPath();
  for (let i = 0; i < 10; i++) { const a = i * Math.PI / 5 - Math.PI / 2, rr = i % 2 ? r * .45 : r; ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); }
  ctx.closePath(); ctx.fill(); ctx.restore(); ctx.shadowBlur = 0;
}

function drawPower(q) {
  const c = q.kind === 'shield' ? '#3df2ff' : '#7dff6b', r = 15 + Math.sin(q.t * 6) * 2;
  glow(c, 20); ctx.strokeStyle = c; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(q.x, q.y, r, 0, 7); ctx.stroke();
  ctx.shadowBlur = 0; ctx.fillStyle = c; ctx.font = '800 15px system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(q.kind === 'shield' ? 'T' : 'S', q.x, q.y + 1); ctx.textBaseline = 'alphabetic';
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}

function drawHud() {
  const top = 34;
  ctx.textAlign = 'left'; ctx.fillStyle = '#fff'; glow('#3df2ff', 12);
  ctx.font = '900 34px system-ui, sans-serif'; ctx.fillText(Math.floor(score), 16, top + 14);
  ctx.shadowBlur = 0; ctx.font = '600 13px system-ui, sans-serif'; ctx.globalAlpha = .6;
  ctx.fillText('REKORD ' + Math.max(best, Math.floor(score)), 16, top + 34); ctx.globalAlpha = 1;
  ctx.fillStyle = '#ffd23d'; ctx.fillText('STREFA ' + zone + '  ·  ⭐ ' + run.stars, 16, top + 52);
  if (combo > 1) { ctx.fillStyle = '#ffd23d'; ctx.font = '900 20px system-ui, sans-serif'; ctx.fillText('x' + combo + ' COMBO', 16, top + 78);
    ctx.fillRect(16, top + 84, 90 * (comboT / 2.5), 3); }
  if (slow > 0) { ctx.textAlign = 'center'; ctx.fillStyle = '#7dff6b'; ctx.font = '800 14px system-ui, sans-serif';
    ctx.fillText('SPOWOLNIENIE ' + slow.toFixed(1) + 's', W / 2, H - 24); }
}

function drawBanner() {
  const b = banners[0]; if (!b) return;
  const a = Math.max(0, Math.min(1, b.t * 2, (2.2 - b.t) * 5)), y = H * .3;
  ctx.globalAlpha = a; ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fillRect(0, y - 46, W, b.sub2 ? 104 : 80);
  glow(b.color, 20); ctx.fillStyle = b.color; ctx.font = '900 34px system-ui, sans-serif'; ctx.fillText(b.title, W / 2, y);
  ctx.shadowBlur = 0; ctx.fillStyle = '#fff'; ctx.font = '600 15px system-ui, sans-serif'; ctx.fillText(b.sub, W / 2, y + 24, W - 24);
  if (b.sub2) { ctx.fillStyle = '#ffd23d'; ctx.font = '800 16px system-ui, sans-serif'; ctx.fillText(b.sub2, W / 2, y + 48); }
  ctx.globalAlpha = 1;
}

// --- pętla gry ---
let last = performance.now();
function loop(now) {
  const dt = Math.min(.033, (now - last) / 1000); last = now;
  if (state === 'play') update(dt);
  if (state === 'dying' && (deadT -= dt) <= 0) showOver();
  if (state !== 'pause') updateFx(dt);
  if (state !== 'dying') setCutoff(state === 'play' && slow > 0 ? 900 : state === 'pause' ? 1200 : 18000, state === 'over' ? .5 : .15);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
